<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Chuỗi sự kiện di sản &quot;Chuyện Tuồng xưa, Chuyện Tuồng nay&quot;">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#9c4266"/>
      <stop offset="1" stop-color="#512235"/>
    </linearGradient>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#ffffff" opacity="0.10"/>
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#dots)"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.14">
    <circle cx="1040" cy="140" r="170" stroke-width="2"/>
