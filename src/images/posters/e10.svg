    <circle cx="1040" cy="140" r="310" stroke-width="2"/>
  </g>
  <text x="1128" y="300" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif"
        font-size="300" font-weight="700" fill="#ffffff" opacity="0.10">10</text>
  <g transform="translate(96 408)">
    <rect x="0" y="-34" width="134" height="34" rx="17" fill="#ffffff" opacity="0.16"/>
    <text x="13" y="-10" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700"
          fill="#ffffff" opacity="0.95">Biểu diễn</text>
  </g>
    <text x="96" y="504" font-family="Helvetica Neue, Arial, sans-serif" font-size="58" font-weight="700" fill="#ffffff">Chuỗi sự kiện di sản &quot;Chuyện</text>
    <text x="96" y="572" font-family="Helvetica Neue, Arial, sans-serif" font-size="58" font-weight="700" fill="#ffffff">Tuồng xưa, Chuyện Tuồng nay&quot;</text>
  <rect x="96" y="606" width="72" height="5" rx="2.5" fill="#ffffff" opacity="0.62"/>
  <text x="96" y="646" font-family="Helvetica Neue, Arial, sans-serif" font-size="26"
