name: Build site image

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - .gitignore
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # index.md, llms.txt and the index.html agent hints are generated inside
      # the image build (see the build stage in the Dockerfile), so there is
      # nothing to verify against the checkout.

      # The registry host is a repository variable so self-hosted instances
      # stay out of this file. Falls back to ghcr.io on github.com.
      - name: Resolve registry
        id: registry
        env:
          REGISTRY_VAR: ${{ vars.REGISTRY_HOST }}
        run: |
          if [ -n "${REGISTRY_VAR}" ]; then
            host="${REGISTRY_VAR}"
          elif [ "${GITHUB_SERVER_URL}" = "https://github.com" ]; then
            host=ghcr.io
          else
            host="$(printf '%s' "${GITHUB_SERVER_URL}" | sed -E 's#^https?://##; s#/.*$##')"
          fi

          case "${host}" in
            ghcr.io) user="${GITHUB_ACTOR}" ;;
            *) user="${GITHUB_REPOSITORY_OWNER}" ;;
          esac

          repo="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "host=${host}"
            echo "image=${host}/${repo}"
            echo "user=${user}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to the registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGEJO_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          if [ "${{ steps.registry.outputs.host }}" = "ghcr.io" ]; then
            token="${GHCR_TOKEN}"
          else
            token="${FORGEJO_TOKEN}"
          fi
          echo "${token}" | docker login "${{ steps.registry.outputs.host }}" \
            --username "${{ steps.registry.outputs.user }}" --password-stdin

      - name: Build image
        run: |
          docker build \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${{ steps.registry.outputs.image }}:${GITHUB_SHA}" \
            --tag "${{ steps.registry.outputs.image }}:latest" \
            .

      - name: Push image
        run: |
          docker push "${{ steps.registry.outputs.image }}:${GITHUB_SHA}"
          docker push "${{ steps.registry.outputs.image }}:latest"
          docker image inspect --format '{{json .RepoDigests}}' "${{ steps.registry.outputs.image }}:${GITHUB_SHA}"
