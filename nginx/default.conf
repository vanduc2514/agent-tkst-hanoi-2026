server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/html text/plain application/json;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;

    location = / {
        try_files /index.html =404;
    }

    # Machine readers get the raw text. Browsers (and any reader that asks for
    # HTML) get a wrapped copy of the same content, because some tools treat a
    # non-HTML response as unreachable. Both come from the same source file.
    location = /index.md {
        default_type text/plain;
        add_header Vary Accept;
        if ($http_accept ~* text/html) {
            rewrite ^ /index.md.html break;
        }
    }

    location = /robots.txt {
        default_type text/plain;
    }

    location = /llms.txt {
        default_type text/plain;
        add_header Vary Accept;
        if ($http_accept ~* text/html) {
            rewrite ^ /llms.txt.html break;
        }
    }

    location = /index.md.html {
        default_type text/html;
    }

    location = /llms.txt.html {
        default_type text/html;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
