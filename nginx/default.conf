# Readers that need a web page rather than a plain-text body: browsers ask for
# HTML, and some agent fetchers report a non-HTML response as unreachable.
map $http_user_agent $agent_reader {
    default 0;
    "~*(ChatGPT-User|OAI-SearchBot|GPTBot|Google-Extended|PerplexityBot|ClaudeBot|Claude-User|CCBot)" 1;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/html text/plain application/json;
    server_tokens off;

    # events.json alone is ~490 KB of JSON; text compresses to about a quarter.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    location = / {
        try_files /index.html =404;
        add_header X-Content-Type-Options nosniff always;
    }

    # Two representations of the same file, chosen per request, so the edge must
    # not cache one and replay it for the other.
    location = /index.md {
        default_type text/plain;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-store" always;
        add_header Vary "Accept, User-Agent" always;
        if ($http_accept ~* text/html) {
            rewrite ^ /index.md.html break;
        }
        if ($agent_reader) {
            rewrite ^ /index.md.html break;
        }
    }

    location = /index.md.html {
        default_type text/html;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-store" always;
        add_header Vary "Accept, User-Agent" always;
    }

    location = /llms.txt {
        default_type text/plain;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-store" always;
        add_header Vary "Accept, User-Agent" always;
        if ($http_accept ~* text/html) {
            rewrite ^ /llms.txt.html break;
        }
        if ($agent_reader) {
            rewrite ^ /llms.txt.html break;
        }
    }

    location = /llms.txt.html {
        default_type text/html;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-store" always;
        add_header Vary "Accept, User-Agent" always;
    }

    # The page fetches this at startup. Revalidate every time (ETag/Last-Modified
    # make it a 304), so a deploy is picked up without a hard refresh.
    location = /events.json {
        default_type application/json;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache" always;
    }

    location = /robots.txt {
        default_type text/plain;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options nosniff always;
    }
}
