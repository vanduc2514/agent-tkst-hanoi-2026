server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/html text/plain text/markdown application/json;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;

    location = / {
        try_files /index.html =404;
    }

    # Plain text is what browsers and agent fetchers handle reliably; the file is
    # still Markdown, only the advertised media type is plain.
    location = /index.md {
        default_type text/plain;
    }

    location = /llms.txt {
        default_type text/plain;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
